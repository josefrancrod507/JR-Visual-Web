.pill{display:inline-block;padding:5px 14px;border:1px solid var(--line);border-radius:999px;font-size:.72rem;letter-spacing:.08em;color:var(--mut);background:rgba(255,255,255,.04);margin-bottom:12px}
#tag{font-size:1.35rem;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:0 0 8px}
#intro{color:var(--mut);font-size:.88rem;margin:0}
#secs{margin-top:16px}
.sec{margin-bottom:10px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));text-align:left;transition:border-color .3s,box-shadow .3s}
.sec.open{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring),0 0 30px -4px var(--g2),0 0 40px -10px var(--g1)}
.sb{width:100%;display:flex;align-items:center;gap:14px;padding:17px 18px;background:transparent;color:var(--fg);border:0;border-radius:20px;font:inherit;cursor:pointer;text-align:left}
.sb:focus-visible,.cta:focus-visible,.alt:focus-visible,#th:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.n{font-size:.7rem;letter-spacing:.14em;color:var(--mut)}.t{flex:1;font-size:1.08rem;font-weight:500;letter-spacing:-.01em}
.pl{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);position:relative;flex:none}.pl::before,.pl::after{content:"";position:absolute;left:8px;right:8px;top:13px;height:1.5px;background:currentColor}.pl::after{transform:rotate(90deg);transition:transform .3s}.sec.open .pl::after{transform:rotate(0)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.sec.open .panel{grid-template-rows:1fr}.in{overflow:hidden;min-height:0;padding:0 14px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:2px 0 14px}
.tile{aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.05);display:block}.tile img{width:100%;height:100%;object-fit:cover;display:block}
.ph{background-image:radial-gradient(var(--line) 1px,transparent 1.6px);background-size:10px 10px}
.soon{grid-column:1/-1;margin:2px 0 0;color:var(--mut);font-size:.8rem;text-align:center}
.contact{margin-top:18px;padding:22px 16px;display:grid;gap:10px}.contact::before{content:"";position:absolute;left:10%;right:10%;top:-60%;height:100%;background:radial-gradient(50% 50% at 50% 50%,var(--g2),transparent 70%);pointer-events:none}.contact>*{position:relative}
.contact h2{margin:0 0 6px;font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
.note{margin:0 0 4px;color:var(--mut);font-size:.86rem;line-height:1.45}.note strong{display:block;color:var(--fg);font-size:1rem;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.cta,.alt{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem}
.cta{background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--ctat);border:1px solid rgba(255,255,255,.35);box-shadow:0 0 28px -4px var(--g1),inset 0 1px 0 rgba(255,255,255,.4)}
.alt{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg)}.cta:hover,.alt:hover{opacity:.85}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row .alt{font-size:.85rem;padding:14px 8px}
svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:28px;color:var(--mut);font-size:.72rem;letter-spacing:.06em}
#th{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<button id="th" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
<main>
  <div class="hero"><div class="logo" role="img" aria-label="Logo VisualsArt"></div><p id="tag"></p><p id="intro"></p></div>
  <section id="secs"></section>
  <nav class="contact" id="contact"></nav>
  <footer id="foot"></footer>
</main>
<script>
/* ============================================================
   EDITA AQUÍ: todo lo que cambia en la página está en CONFIG.
   - theme: "red" (rojo), "twilight" (morado + naranja), "ember" (naranja),
     "violet" (morado) o "mono" (blanco y negro)
   - sections: agrega, quita o renombra apartados.
     items: lista de fotos. Con tu propio dominio, sube las
     imágenes junto a este archivo y escribe su ruta,
     por ejemplo: items: ["fotos/01.jpg", "fotos/02.jpg"]
     (si un apartado es un álbum externo: link: "https://...")
   ============================================================ */
const CONFIG = {
  theme: "red",
  showThemeToggle: true,
  contactNote: "<strong>Información y cotizaciones</strong>Para más información o consulta de precios.",
  tagline: "Fotografía · Diseño digital · Arte manual",
  intro: "Elige un apartado para ver mi trabajo.",
  whatsapp: { number: "50767909919", label: "Escríbeme por WhatsApp",
              message: "Hola, vengo desde tu página de VisualsArt y quiero más información." },
  email: "josrodpty507@gmail.com",
  instagram: "jr_visualsart",
  sections: [
    { title: "Fotografías",    items: ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","10.jpg","11.jpg"] },
    { title: "Diseño digital", items: [] },
    { title: "Arte manual",  items: [] }
  ]
};
/* ---------------- a partir de aquí no hace falta tocar ---------------- */
const $ = s => document.querySelector(s), root = document.documentElement;
const IC = {
  wa:'<svg viewBox="0 0 24 24"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8z"/><path d="M9 9.5c.4 2.2 2.3 4.1 5 5l1.3-1.2-1.8-1-.8.7c-.9-.4-1.6-1.1-2-2l.7-.8-1-1.8z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>',
  ig:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6" fill="currentColor"/></svg>'};
$("#tag").textContent = CONFIG.tagline; $("#intro").textContent = CONFIG.intro;
$("#secs").innerHTML = CONFIG.sections.map((s, i) => {
  const items = (s.items || []).map(it => typeof it === "string" ? { src: it } : it);
  const tiles = items.length
    ? items.map(it => `<a class="tile" href="${it.link || it.src}" target="_blank" rel="noopener"><img loading="lazy" src="${it.src}" alt="${it.alt || s.title}"></a>`).join("")
    : '<div class="tile ph"></div>'.repeat(6) + '<p class="soon">Próximamente</p>';
  const ext = s.link ? `<a class="alt" style="margin:10px 0 4px" href="${s.link}" target="_blank" rel="noopener">Ver álbum completo</a>` : "";
  return `<div class="sec"><button class="sb" aria-expanded="false" aria-controls="p${i}"><span class="n">0${i + 1}</span><span class="t">${s.title}</span><span class="pl" aria-hidden="true"></span></button><div class="panel" id="p${i}"><div class="in"><div class="g">${tiles}</div>${ext}</div></div></div>`;
}).join("");
document.querySelectorAll(".sb").forEach(b => b.onclick = () => {
  const sec = b.parentElement, open = !sec.classList.contains("open");
  document.querySelectorAll(".sec").forEach(x => { x.classList.remove("open"); x.querySelector(".sb").setAttribute("aria-expanded", "false"); });
  if (open) { sec.classList.add("open"); b.setAttribute("aria-expanded", "true"); }
});
const wa = "https://wa.me/" + CONFIG.whatsapp.number + "?text=" + encodeURIComponent(CONFIG.whatsapp.message);
$("#contact").innerHTML = `<p class="note">${CONFIG.contactNote}</p><a class="cta" href="${wa}" target="_blank" rel="noopener">${IC.wa}${CONFIG.whatsapp.label}</a>
<div class="row"><a class="alt" href="mailto:${CONFIG.email}">${IC.mail}Correo</a><a class="alt" href="https://instagram.com/${CONFIG.instagram}" target="_blank" rel="noopener">${IC.ig}@${CONFIG.instagram}</a></div>`;
$("#foot").textContent = "© " + new Date().getFullYear() + " VisualsArt";
const T = ["red", "twilight", "ember", "violet", "mono"]; root.dataset.theme = CONFIG.theme;
if (!CONFIG.showThemeToggle) $("#th").hidden = true;
$("#th").onclick = () => { const i = T.indexOf(root.dataset.theme); root.dataset.theme = T[(i + 1) % T.length]; };
</script>
</body>
</html>
